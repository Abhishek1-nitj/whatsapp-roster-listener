services:
  - type: web
    name: whatsapp-roster-listener
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: TARGET_GROUP_ID
        value: 120363412628405469@g.us
    disk:
      name: session-data
      mountPath: /app/auth_session
      sizeGB: 1
